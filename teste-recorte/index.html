<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste de recorte</title>
<style>
body{margin:0;font:16px -apple-system,Helvetica,sans-serif;background:#fff;color:#111;padding:18px}
h1{font-weight:400;letter-spacing:.08em;font-size:22px;margin:0 0 6px}
p{color:#666;margin:0 0 14px;font-size:14px}
button,label.b{display:inline-block;border:1px solid #111;background:#fff;padding:12px 16px;font-size:15px;margin:4px 6px 4px 0;color:#111}
button[aria-pressed=true]{background:#111;color:#fff}
#log{font:13px ui-monospace,Menlo,monospace;background:#f4f4f4;padding:10px;white-space:pre-wrap;margin:10px 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
canvas{width:100%;height:auto;display:block;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/20px 20px}
.cap{font-size:12px;color:#666;margin:6px 0 2px}
</style></head><body>
<h1>TESTE DE RECORTE</h1>
<p>Modelo novo (BiRefNet) rodando no próprio celular. Escolha uma foto e espere. O tempo aparece no quadro cinza.</p>
<div><button id="mfp16" aria-pressed="true">Modelo leve (115 MB)</button><button id="mfp32" aria-pressed="false">Modelo completo (224 MB)</button></div>
<label class="b" for="f">Escolher foto</label><input id="f" type="file" accept="image/*" hidden>
<div id="log"></div>
<div class="row"><div><div class="cap">fundo branco</div><canvas id="cw"></canvas></div><div><div class="cap">transparência</div><canvas id="cc"></canvas></div></div>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.webgpu.min.js"></script>
<script>
const log=document.getElementById('log'),L=t=>{log.textContent+=(log.textContent?'\n':'')+t};
const URLS={fp16:'https://huggingface.co/onnx-community/BiRefNet_lite-ONNX/resolve/main/onnx/model_fp16.onnx',fp32:'https://huggingface.co/onnx-community/BiRefNet_lite-ONNX/resolve/main/onnx/model.onnx'};
let sess=null,which='fp16',ep='',loading=null;
ort.env.wasm.wasmPaths='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
L('Placa de vídeo no navegador (WebGPU): '+(navigator.gpu?'sim':'não'));
async function load(w){
 which=w;sess=null;document.getElementById('mfp16').setAttribute('aria-pressed',w==='fp16');document.getElementById('mfp32').setAttribute('aria-pressed',w==='fp32');
 L('Baixando modelo '+(w==='fp16'?'leve':'completo')+'…');const t=performance.now();
 const r=await fetch(URLS[w]);if(!r.ok)throw new Error('download '+r.status);
 const n=+r.headers.get('content-length')||0,rd=r.body.getReader(),parts=[];let got=0,last=0;
 for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;if(n&&got-last>n/5){last=got;L('  '+Math.round(got/n*100)+'%')}}
 const buf=new Uint8Array(got);let o=0;for(const p of parts){buf.set(p,o);o+=p.length}
 L('Baixado em '+((performance.now()-t)/1000).toFixed(1)+' s. Preparando…');
 for(const e of (navigator.gpu?['webgpu','wasm']:['wasm'])){
  try{const t2=performance.now();sess=await ort.InferenceSession.create(buf,{executionProviders:[e]});ep=e;L('Pronto ('+(e==='webgpu'?'placa de vídeo':'processador')+', '+((performance.now()-t2)/1000).toFixed(1)+' s)');break}
  catch(err){L('Não rodou em '+e+': '+(err.message||err))}
 }
}
const go=w=>{loading=load(w).catch(e=>L('Erro: '+e.message));};
document.getElementById('mfp16').onclick=()=>go('fp16');document.getElementById('mfp32').onclick=()=>go('fp32');
function box(arr,ch,w,h,R){const tmp=new Float32Array(arr.length),res=new Float32Array(arr.length),acc=new Float32Array(ch);
 for(let y=0;y<h;y++){acc.fill(0);for(let x=-R;x<w;x++){if(x+R<w)for(let c=0;c<ch;c++)acc[c]+=arr[(y*w+x+R)*ch+c];if(x-R-1>=0)for(let c=0;c<ch;c++)acc[c]-=arr[(y*w+x-R-1)*ch+c];if(x>=0)for(let c=0;c<ch;c++)tmp[(y*w+x)*ch+c]=acc[c]}}
 for(let x=0;x<w;x++){acc.fill(0);for(let y=-R;y<h;y++){if(y+R<h)for(let c=0;c<ch;c++)acc[c]+=tmp[((y+R)*w+x)*ch+c];if(y-R-1>=0)for(let c=0;c<ch;c++)acc[c]-=tmp[((y-R-1)*w+x)*ch+c];if(y>=0)for(let c=0;c<ch;c++)res[(y*w+x)*ch+c]=acc[c]}}
 return res}
document.getElementById('f').onchange=async e=>{
 const file=e.target.files[0];if(!file)return;
 if(!sess){if(!loading)go(which);await loading}if(!sess){L('Sem modelo.');return}
 const img=await createImageBitmap(file),N=1024,c=new OffscreenCanvas(N,N),g=c.getContext('2d');g.drawImage(img,0,0,N,N);
 const px=g.getImageData(0,0,N,N).data,n=N*N,inp=new Float32Array(3*n),m=[.485,.456,.406],s=[.229,.224,.225];
 for(let i=0,j=0;j<n;i+=4,j++){inp[j]=(px[i]/255-m[0])/s[0];inp[j+n]=(px[i+1]/255-m[1])/s[1];inp[j+2*n]=(px[i+2]/255-m[2])/s[2]}
 L('Recortando…');const t=performance.now();let out;
 try{out=await sess.run({input_image:new ort.Tensor('float32',inp,[1,3,N,N])})}catch(err){L('Erro: '+err.message);return}
 const o=out[Object.keys(out)[0]].data;L('Recorte em '+((performance.now()-t)/1000).toFixed(1)+' s');
 const W=img.width,H=img.height,k=Math.min(1,1600/Math.max(W,H)),w=Math.round(W*k),h=Math.round(H*k);
 const a=new OffscreenCanvas(N,N),ag=a.getContext('2d'),ad=ag.createImageData(N,N);
 for(let j=0;j<n;j++){ad.data[j*4+3]=Math.round(255/(1+Math.exp(-o[j])))}ag.putImageData(ad,0,0);
 const big=new OffscreenCanvas(w,h),bg=big.getContext('2d');bg.imageSmoothingQuality='high';bg.drawImage(a,0,0,w,h);const A=bg.getImageData(0,0,w,h).data;
 const src=new OffscreenCanvas(w,h),sg=src.getContext('2d');sg.drawImage(img,0,0,w,h);const P=sg.getImageData(0,0,w,h).data;
 const bs=new Float32Array(w*h*3),bw=new Float32Array(w*h);
 for(let i=0;i<w*h;i++){if(A[i*4+3]<5){bw[i]=1;bs[i*3]=P[i*4];bs[i*3+1]=P[i*4+1];bs[i*3+2]=P[i*4+2]}}
 const BS=box(bs,3,w,h,14),BW=box(bw,1,w,h,14),D=new ImageData(w,h);
 for(let i=0;i<w*h;i++){const al=A[i*4+3]/255;let r=P[i*4],gg=P[i*4+1],b=P[i*4+2];
  if(al>.05&&al<.97&&BW[i]>0){const Br=BS[i*3]/BW[i],Bg=BS[i*3+1]/BW[i],Bb=BS[i*3+2]/BW[i];r=Math.min(255,Math.max(0,Br+(r-Br)/al));gg=Math.min(255,Math.max(0,Bg+(gg-Bg)/al));b=Math.min(255,Math.max(0,Bb+(b-Bb)/al))}
  D.data[i*4]=r;D.data[i*4+1]=gg;D.data[i*4+2]=b;D.data[i*4+3]=A[i*4+3]}
 const t2=new OffscreenCanvas(w,h);t2.getContext('2d').putImageData(D,0,0);
 for(const [id,white] of [['cw',1],['cc',0]]){const cv=document.getElementById(id);cv.width=w;cv.height=h;const x=cv.getContext('2d');if(white){x.fillStyle='#fff';x.fillRect(0,0,w,h)}x.drawImage(t2,0,0)}
 L('Total com acabamento: '+((performance.now()-t)/1000).toFixed(1)+' s');
};
go('fp16');
</script></body></html>
